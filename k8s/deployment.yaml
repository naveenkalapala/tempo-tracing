apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: logging
  labels:
    app: log-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: log-generator
          image: nkalapala24/log-generator:v2
          imagePullPolicy: Always
          env:
            - name: LOGS_PER_SECOND
              value: "10"
            - name: ERROR_RATE
              value: "0.05"
            - name: WARN_RATE
              value: "0.10"
            - name: DEBUG_RATE
              value: "0.10"
            - name: ENVIRONMENT
              value: "dev"
            - name: REGION
              value: "us-east-1"
            - name: CLUSTER
              value: "eks-dev-cluster"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTLP_ENDPOINT
              value: "http://alloy.logging.svc.cluster.local:4317"
            - name: TRACING_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
